<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0b0f19"/>
<title>柚刃 · 刀客装饰系统</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./cloud.js"></script>
<style>
:root{
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
  --safe-right:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;
  min-height:100%;
  min-height:100dvh;
  background:#0b0f19;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:#f8fafc;
  overflow-x:hidden;
}
body{user-select:none}
button,a{touch-action:pan-y manipulation}
canvas#preview-canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  z-index:0;
  touch-action:none;
}
.page-wrap{
  position:relative;
  z-index:1;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:calc(16px + var(--safe-top)) calc(14px + var(--safe-right)) calc(18px + var(--safe-bottom)) calc(14px + var(--safe-left));
  pointer-events:none;
}
.card{
  pointer-events:auto;
  width:100%;
  max-width:min(500px,calc(100vw - 28px));
  background:linear-gradient(160deg,rgba(30,41,59,.88),rgba(15,23,42,.94));
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(251,191,36,.35);
  border-radius:clamp(20px,5.4vw,28px);
  padding:clamp(16px,4vw,22px);
  text-align:center;
  box-shadow:0 24px 60px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.14);
}
.top-nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  gap:8px;
}
.back-link{
  display:inline-flex;
  align-items:center;
  gap:4px;
  color:#38bdf8;
  text-decoration:none;
  font-size:13px;
  font-weight:700;
  padding:6px 10px;
  border-radius:10px;
  background:rgba(56,189,248,.1);
  border:1px solid rgba(56,189,248,.25);
  white-space:nowrap;
}
.badge{
  display:inline-block;
  padding:4px 12px;
  border-radius:99px;
  font-size:clamp(9px,2.4vw,11px);
  letter-spacing:1.5px;
  color:#fcd34d;
  background:rgba(251,191,36,.12);
  border:1px solid rgba(251,191,36,.3);
  margin-bottom:6px;
}
.title{
  font-size:clamp(22px,6.2vw,28px);
  font-weight:900;
  letter-spacing:1.5px;
  background:linear-gradient(135deg,#fff,#fde68a 45%,#fb7185);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:4px;
}
.subtitle{
  font-size:clamp(11px,2.8vw,12px);
  color:#94a3b8;
  line-height:1.45;
  margin-bottom:14px;
}
.sec-block{margin-bottom:14px;text-align:left}
.sec-title{
  font-size:clamp(12px,3.2vw,13px);
  color:#cbd5e1;
  margin-bottom:8px;
  font-weight:800;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.sec-hint{font-size:11px;color:#94a3b8;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.skin-grid,.blade-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.skin-btn,.blade-btn{
  border:2px solid rgba(255,255,255,.14);
  border-radius:14px;
  padding:11px 6px;
  background:rgba(255,255,255,.04);
  color:#cbd5e1;
  font-size:clamp(11px,3vw,13px);
  font-weight:700;
  cursor:pointer;
  transition:all .2s;
  text-align:center;
  line-height:1.3;
  min-height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
}
.skin-btn.active{
  border-color:#fbbf24;
  background:rgba(251,191,36,.18);
  color:#fde047;
  transform:scale(1.02);
  box-shadow:0 0 16px rgba(251,191,36,.2);
}
.blade-btn.active{
  border-color:#38bdf8;
  background:rgba(56,189,248,.18);
  color:#7dd3fc;
  transform:scale(1.02);
  box-shadow:0 0 16px rgba(56,189,248,.2);
}
.btn-group{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.btn-main{
  width:100%;
  padding:13px;
  border-radius:14px;
  border:none;
  font-size:clamp(14px,4vw,15px);
  font-weight:800;
  letter-spacing:1px;
  cursor:pointer;
  color:#0f172a;
  background:linear-gradient(135deg,#fde047,#fb923c);
  box-shadow:0 8px 22px rgba(251,146,60,.35);
  transition:transform .15s;
  min-height:46px;
}
.btn-main:active{transform:scale(.97)}
.btn-sub{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  padding:12px;
  border-radius:14px;
  border:1px solid rgba(56,189,248,.4);
  font-size:clamp(12px,3.6vw,14px);
  font-weight:700;
  text-decoration:none;
  color:#e0f2fe;
  background:linear-gradient(135deg,rgba(14,165,233,.2),rgba(45,212,191,.15));
  transition:transform .15s;
  min-height:44px;
}
.btn-sub:active{transform:scale(.97)}
.toast-msg{
  position:fixed;
  top:calc(18px + var(--safe-top));
  left:50%;
  transform:translateX(-50%) translateY(-16px);
  background:rgba(15,23,42,.95);
  border:1px solid rgba(251,191,36,.5);
  color:#fde047;
  padding:9px 18px;
  border-radius:99px;
  font-size:13px;
  font-weight:700;
  z-index:50;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s,transform .25s;
  box-shadow:0 10px 25px rgba(0,0,0,.5);
  white-space:nowrap;
}
.toast-msg.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<canvas id="preview-canvas"></canvas>
<div class="toast-msg" id="toast-msg"></div>

<div class="page-wrap">
  <div class="card">
    <div class="top-nav">
      <a class="back-link" href="./index.html">← 返回主页</a>
      <span class="sec-hint" id="current-combo-tag">竹影清风 · 烈焰斩魔</span>
    </div>

    <span class="badge">CUSTOMIZATION & SKINS</span>
    <h1 class="title">刀客装饰系统</h1>
    <p class="subtitle">切换背景氛围与刀痕特效（可在空白处滑动体验刀光），保存后自动同步至游戏。</p>

    <div class="sec-block">
      <div class="sec-title">
        <span>🎨 场景背景主题 (Background Themes)</span>
        <span class="sec-hint">自动保存</span>
      </div>
      <div class="skin-grid">
        <button class="skin-btn" data-skin="bamboo" data-label="竹影清风">🎋 竹影清风</button>
        <button class="skin-btn" data-skin="sunset" data-label="日落茶屋">🌅 日落茶屋</button>
        <button class="skin-btn" data-skin="cyber" data-label="赛博霓虹">🌆 赛博霓虹</button>
        <button class="skin-btn" data-skin="sakura" data-label="樱雪温泉">🌸 樱雪温泉</button>
      </div>
    </div>

    <div class="sec-block">
      <div class="sec-title">
        <span>⚔️ 专属刀痕皮肤 (Blade Skins)</span>
        <span class="sec-hint">自动保存</span>
      </div>
      <div class="blade-grid">
        <button class="blade-btn" data-blade="flame" data-label="烈焰斩魔">🔥 烈焰斩魔</button>
        <button class="blade-btn" data-blade="frost" data-label="冰魄寒霜">❄️ 冰魄寒霜</button>
        <button class="blade-btn" data-blade="lightning" data-label="闪电雷鸣">⚡ 闪电雷鸣</button>
        <button class="blade-btn" data-blade="sakura" data-label="樱吹雪影">🌸 樱吹雪影</button>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn-main" id="save-and-play-btn">保存并前往游戏玩法</button>
      <a class="btn-sub" href="./index.html">完成并返回主菜单</a>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

const Cloud = window.PomeloCloud;
const BLADE_CONFIGS = {
  flame:     { outer: "rgba(251,146,60,0.75)", core: "#fff5f5", spark: "#f97316" },
  frost:     { outer: "rgba(56,189,248,0.75)", core: "#e0f2fe", spark: "#38bdf8" },
  lightning: { outer: "rgba(250,204,21,0.8)",  core: "#fef08a", spark: "#eab308" },
  sakura:    { outer: "rgba(244,114,182,0.75)",core: "#fdf2f8", spark: "#ec4899" }
};

let config = Cloud.getDecorConfig();
let toastTimer = null;

function showToast(msg) {
  const el = document.getElementById("toast-msg");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
}

const cvs = document.getElementById("preview-canvas");
const ctx = cvs.getContext("2d");
let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
let particles = [];
let trail = [];
let swiping = false;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cvs.width = Math.floor(W * DPR);
  cvs.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  initParticles();
}

function initParticles() {
  particles = [];
  const count = config.bgSkin === "cyber" ? 42 : 22;
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: config.bgSkin === "cyber" ? (Math.random() - 0.5) * 1.4 : (-0.4 - Math.random() * 0.6),
      vy: config.bgSkin === "cyber" ? (1 + Math.random() * 2.2) : (0.5 + Math.random() * 0.8),
      size: config.bgSkin === "sakura" ? (4 + Math.random() * 5) : (2 + Math.random() * 4),
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.03,
      alpha: 0.18 + Math.random() * 0.42
    });
  }
}

function drawBackground() {
  const bgGrad = ctx.createRadialGradient(W * 0.5, H * 0.35, 30, W * 0.5, H * 0.5, Math.max(W, H) * 0.85);
  if (config.bgSkin === "bamboo") {
    bgGrad.addColorStop(0, "#13201d"); bgGrad.addColorStop(1, "#070c0b");
    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "rgba(20,45,35,0.45)";
    ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(0, H * 0.65);
    ctx.quadraticCurveTo(W * 0.3, H * 0.5, W * 0.6, H * 0.6);
    ctx.quadraticCurveTo(W * 0.85, H * 0.7, W, H * 0.62);
    ctx.lineTo(W, H); ctx.fill();
  } else if (config.bgSkin === "sunset") {
    bgGrad.addColorStop(0, "#3b1c1c"); bgGrad.addColorStop(0.5, "#1e1124"); bgGrad.addColorStop(1, "#0a0712");
    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
    const sun = ctx.createRadialGradient(W * 0.5, H * 0.3, 10, W * 0.5, H * 0.3, W * 0.4);
    sun.addColorStop(0, "rgba(251,146,60,0.35)"); sun.addColorStop(1, "rgba(251,146,60,0)");
    ctx.fillStyle = sun; ctx.fillRect(0, 0, W, H);
  } else if (config.bgSkin === "cyber") {
    bgGrad.addColorStop(0, "#2e1065"); bgGrad.addColorStop(0.5, "#1e1b4b"); bgGrad.addColorStop(1, "#030712");
    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(236,72,153,0.12)"; ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 60) {
      ctx.beginPath(); ctx.moveTo(x, H * 0.5); ctx.lineTo((x - W * 0.5) * 2.2 + W * 0.5, H); ctx.stroke();
    }
  } else {
    bgGrad.addColorStop(0, "#2d1b2d"); bgGrad.addColorStop(0.5, "#1d1524"); bgGrad.addColorStop(1, "#09070d");
    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
  }

  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    if (p.x < -20) p.x = W + 20; if (p.x > W + 20) p.x = -20;
    if (p.y > H + 20) { p.y = -20; p.x = Math.random() * W; }
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.globalAlpha = p.alpha;
    if (config.bgSkin === "sakura") {
      ctx.fillStyle = "#f472b6";
      ctx.beginPath(); ctx.ellipse(0, 0, p.size, p.size * 0.6, 0, 0, Math.PI * 2); ctx.fill();
    } else if (config.bgSkin === "cyber") {
      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(0, 0, p.size * 1.5, p.size * 1.5);
    } else {
      ctx.fillStyle = config.bgSkin === "sunset" ? "#f59e0b" : "#84cc16";
      ctx.beginPath(); ctx.ellipse(0, 0, p.size * 2, p.size, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  });
  ctx.globalAlpha = 1;
}

function render(now) {
  drawBackground();
  const cutoff = now - 160;
  trail = trail.filter(pt => pt.t >= cutoff);
  if (trail.length >= 2) {
    const bladeCfg = BLADE_CONFIGS[config.bladeSkin] || BLADE_CONFIGS.flame;
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    for (let i = 1; i < trail.length; i++) {
      const p0 = trail[i - 1], p1 = trail[i], ratio = i / trail.length;
      ctx.strokeStyle = bladeCfg.outer;
      ctx.lineWidth = ratio * 18;
      ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();

      ctx.strokeStyle = bladeCfg.core;
      ctx.lineWidth = ratio * 6;
      ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
    }
  }
  requestAnimationFrame(render);
}

cvs.addEventListener("pointerdown", e => {
  swiping = true;
  trail = [{ x: e.clientX, y: e.clientY, t: performance.now() }];
});
window.addEventListener("pointermove", e => {
  if (!swiping) return;
  trail.push({ x: e.clientX, y: e.clientY, t: performance.now() });
  if (trail.length > 22) trail.shift();
});
window.addEventListener("pointerup", () => { swiping = false; });

function syncUI() {
  document.querySelectorAll(".skin-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.skin === config.bgSkin);
  });
  document.querySelectorAll(".blade-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.blade === config.bladeSkin);
  });
  document.getElementById("current-combo-tag").textContent = `${config.bgLabel} · ${config.bladeLabel}`;
}

document.querySelectorAll(".skin-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    config = Cloud.saveDecorConfig({
      bgSkin: btn.dataset.skin,
      bgLabel: btn.dataset.label || btn.textContent.trim()
    });
    initParticles();
    syncUI();
    showToast(`背景已切换：${config.bgLabel}`);
  });
});

document.querySelectorAll(".blade-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    config = Cloud.saveDecorConfig({
      bladeSkin: btn.dataset.blade,
      bladeLabel: btn.dataset.label || btn.textContent.trim()
    });
    const cy = H * 0.5;
    trail = [];
    for (let i = 0; i < 10; i++) {
      trail.push({ x: W * 0.25 + i * (W * 0.05), y: cy - Math.sin(i * 0.4) * 35, t: performance.now() });
    }
    syncUI();
    showToast(`刀痕已切换：${config.bladeLabel}`);
  });
});

document.getElementById("save-and-play-btn").addEventListener("click", () => {
  Cloud.saveDecorConfig(config);
  window.location.href = "./game.html";
});

window.addEventListener("resize", resize);
resize();
syncUI();
requestAnimationFrame(render);
})();
</script>
</body>
</html>
