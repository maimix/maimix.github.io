<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0b0f19"/>
<link rel="icon" href="data:,"/>
<title>柚刃 · POMELO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./cloud.js"></script>
<style>
:root{
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
  --safe-right:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;
  min-height:100%;
  min-height:100dvh;
  background:radial-gradient(circle at 50% 25%,rgba(30,41,59,.9),#070a13 75%);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:#f8fafc;
  overflow-x:hidden;
}
body{user-select:none}
button,a,.btn-main,.btn-sub,.nav-link{touch-action:pan-y manipulation}

.page-wrap{
  min-height:100dvh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:calc(16px + var(--safe-top)) calc(14px + var(--safe-right)) calc(18px + var(--safe-bottom)) calc(14px + var(--safe-left));
}
.card{
  width:100%;
  max-width:min(500px,calc(100vw - 28px));
  background:linear-gradient(160deg,rgba(30,41,59,.95),rgba(15,23,42,.99));
  border:1px solid rgba(251,191,36,.35);
  border-radius:clamp(20px,5.4vw,28px);
  padding:clamp(16px,4vw,22px);
  text-align:center;
  box-shadow:0 24px 60px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.15);
}
.badge{
  display:inline-block;
  padding:4px 12px;
  border-radius:99px;
  font-size:clamp(9px,2.4vw,11px);
  letter-spacing:1.5px;
  color:#fcd34d;
  background:rgba(251,191,36,.12);
  border:1px solid rgba(251,191,36,.3);
  margin-bottom:6px;
}
.title{
  font-size:clamp(24px,6.6vw,32px);
  font-weight:900;
  letter-spacing:2px;
  background:linear-gradient(135deg,#fff,#fde68a 45%,#fb7185);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:4px;
}
.subtitle{
  font-size:clamp(11px,2.8vw,12px);
  color:#94a3b8;
  line-height:1.45;
  margin-bottom:14px;
}

.profile-strip{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);
  border-radius:16px;
  padding:10px 12px;
  margin-bottom:12px;
  text-align:left;
}
.player-info{min-width:0;flex:1}
.player-name{
  font-size:14px;
  font-weight:800;
  color:#fde047;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.player-decor{
  font-size:11px;
  color:#94a3b8;
  margin-top:2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.mini-actions{display:flex;gap:6px;flex-shrink:0}
.mini-btn{
  border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.06);
  color:#e2e8f0;
  border-radius:10px;
  padding:6px 10px;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
}
.mini-btn:active{transform:scale(.96)}

.tab-bar{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-bottom:12px;
}
.tab-btn{
  padding:9px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.04);
  color:#cbd5e1;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
}
.tab-btn.active{
  border-color:rgba(251,191,36,.6);
  background:rgba(251,191,36,.16);
  color:#fde047;
}

.panel-box{
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  padding:12px;
  margin-bottom:14px;
  text-align:left;
}
.lb-list{display:flex;flex-direction:column;gap:6px;max-height:175px;overflow-y:auto}
.lb-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:7px 10px;
  border-radius:10px;
  background:rgba(255,255,255,.04);
  font-size:12px;
}
.lb-row.me{
  border:1px solid rgba(251,191,36,.45);
  background:rgba(251,191,36,.12);
  color:#fde047;
  font-weight:800;
}
.lb-left{display:flex;align-items:center;gap:8px;min-width:0}
.lb-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-score{font-weight:800;color:#fb923c;font-variant-numeric:tabular-nums}

.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.stat-box{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;
  padding:8px;
  text-align:center;
}
.stat-num{font-size:15px;font-weight:800;color:#fde047}
.stat-lbl{font-size:10px;color:#94a3b8;margin-top:2px}
.ach-wrap{display:flex;flex-wrap:wrap;gap:6px}
.ach-pill{
  font-size:11px;
  padding:4px 9px;
  border-radius:99px;
  border:1px solid rgba(255,255,255,.12);
  color:#64748b;
  background:rgba(255,255,255,.02);
}
.ach-pill.unlocked{
  border-color:rgba(250,204,21,.45);
  color:#fde047;
  background:rgba(250,204,21,.12);
  font-weight:700;
}

.btn-group{display:flex;flex-direction:column;gap:8px}
.btn-main{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  padding:13px;
  border-radius:14px;
  border:none;
  text-decoration:none;
  font-size:clamp(14px,4.2vw,16px);
  font-weight:800;
  letter-spacing:1px;
  cursor:pointer;
  color:#0f172a;
  background:linear-gradient(135deg,#fde047,#fb923c);
  box-shadow:0 8px 22px rgba(251,146,60,.35);
  transition:transform .15s;
  min-height:48px;
}
.btn-main:active{transform:scale(.97)}
.btn-sub{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  padding:12px;
  border-radius:14px;
  border:1px solid rgba(56,189,248,.4);
  font-size:clamp(12px,3.6vw,14px);
  font-weight:700;
  text-decoration:none;
  cursor:pointer;
  color:#e0f2fe;
  background:linear-gradient(135deg,rgba(14,165,233,.2),rgba(45,212,191,.15));
  transition:transform .15s;
  min-height:44px;
}
.btn-sub:active{transform:scale(.97)}

.toast-msg{
  position:fixed;
  top:calc(18px + var(--safe-top));
  left:50%;
  transform:translateX(-50%) translateY(-16px);
  background:rgba(15,23,42,.95);
  border:1px solid rgba(251,191,36,.5);
  color:#fde047;
  padding:9px 18px;
  border-radius:99px;
  font-size:13px;
  font-weight:700;
  z-index:60;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s,transform .25s;
  box-shadow:0 10px 25px rgba(0,0,0,.5);
  white-space:nowrap;
}
.toast-msg.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="toast-msg" id="toast-msg"></div>

<div class="page-wrap">
  <div class="card">
    <span class="badge">POMELO BLADE · MAIN HUB</span>
    <h1 class="title">柚刃 · POMELO</h1>
    <p class="subtitle">滑动斩切蜜柚，鲜榨果汁连斩，冲击云端排行榜。</p>

    <div class="profile-strip">
      <div class="player-info">
        <div class="player-name" id="player-name-text">👤 侠客：霜叶</div>
        <div class="player-decor" id="player-decor-text">装扮：竹影清风 · 烈焰斩魔</div>
      </div>
      <div class="mini-actions">
        <button class="mini-btn" id="rename-btn">改名</button>
        <button class="mini-btn" id="refresh-lb-btn">刷新榜</button>
      </div>
    </div>

    <div class="tab-bar">
      <button class="tab-btn active" data-tab="lb">🏆 巅峰排行榜</button>
      <button class="tab-btn" data-tab="profile">🪪 个人档案</button>
    </div>

    <div class="panel-box" id="panel-lb">
      <div class="lb-list" id="lb-list">
        <div class="lb-row"><span class="lb-name">正在读取排行榜...</span></div>
      </div>
    </div>

    <div class="panel-box" id="panel-profile" style="display:none">
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-num" id="p-best">0</div><div class="stat-lbl">最高纪录</div></div>
        <div class="stat-box"><div class="stat-num" id="p-juice">0 ml</div><div class="stat-lbl">累计榨汁</div></div>
        <div class="stat-box"><div class="stat-num" id="p-sliced">0 个</div><div class="stat-lbl">累计切柚</div></div>
        <div class="stat-box"><div class="stat-num" id="p-combo">0 连斩</div><div class="stat-lbl">最高连斩</div></div>
      </div>
      <div class="ach-wrap" id="ach-list"></div>
    </div>

    <div class="btn-group">
      <a class="btn-main" href="./game.html">⚔️ 挑战模式 / 开始游戏</a>
      <a class="btn-sub" href="./decor.html">🎨 装饰系统（背景与刀痕）</a>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const Cloud = window.PomeloCloud;
  let toastTimer = null;

  function showToast(msg) {
    const el = document.getElementById("toast-msg");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
  }

  function renderHeader() {
    if (!Cloud) return;
    const user = Cloud.getCurrentUser();
    const decor = Cloud.getDecorConfig();
    document.getElementById("player-name-text").textContent = `👤 侠客：${user}`;
    document.getElementById("player-decor-text").textContent = `装扮：${decor.bgLabel} · ${decor.bladeLabel}`;
  }

  function renderProfile() {
    if (!Cloud) return;
    const user = Cloud.getCurrentUser();
    const uData = Cloud.getUserData(user);
    document.getElementById("p-best").textContent = uData.bestArcade;
    document.getElementById("p-juice").textContent = `${uData.totalJuice.toLocaleString()} ml`;
    document.getElementById("p-sliced").textContent = `${uData.totalSliced} 个`;
    document.getElementById("p-combo").textContent = `${uData.maxCombo} 连斩`;

    const achBox = document.getElementById("ach-list");
    achBox.innerHTML = Cloud.ACHIEVEMENTS_DEF.map(ach => {
      const unlocked = uData.unlockedAch.includes(ach.id);
      return `<span class="ach-pill ${unlocked ? "unlocked" : ""}" title="${ach.desc}">${unlocked ? "🏅 " : "🔒 "}${ach.name}</span>`;
    }).join("");
  }

  async function renderLeaderboard(notify = false) {
    const listEl = document.getElementById("lb-list");
    if (!Cloud) {
      listEl.innerHTML = `<div class="lb-row"><span class="lb-name">cloud.js 未加载，请检查仓库文件</span></div>`;
      return;
    }
    const currentUser = Cloud.getCurrentUser();
    const rows = await Cloud.fetchLeaderboard(10);

    if (!rows.length) {
      listEl.innerHTML = `<div class="lb-row"><span class="lb-name">暂无记录，快去挑战模式开局吧！</span></div>`;
    } else {
      listEl.innerHTML = rows.map((item, idx) => {
        const medal = idx === 0 ? "🥇" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : `#${idx + 1}`;
        const isMe = item.name === currentUser;
        return `
          <div class="lb-row ${isMe ? "me" : ""}">
            <div class="lb-left">
              <span>${medal}</span>
              <span class="lb-name">${item.name}${isMe ? " (我)" : ""}</span>
            </div>
            <span class="lb-score">${item.score} 分</span>
          </div>
        `;
      }).join("");
    }

    if (notify) showToast("排行榜已更新");
  }

  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const tab = btn.dataset.tab;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
      document.getElementById("panel-lb").style.display = tab === "lb" ? "block" : "none";
      document.getElementById("panel-profile").style.display = tab === "profile" ? "block" : "none";
      if (tab === "profile") renderProfile();
      if (tab === "lb") renderLeaderboard(false);
    });
  });

  document.getElementById("rename-btn").addEventListener("click", async () => {
    if (!Cloud) return;
    const oldName = Cloud.getCurrentUser();
    const nextInput = window.prompt("请输入新的侠客昵称：", oldName);
    if (nextInput === null) return;
    const clean = Cloud.setCurrentUser(nextInput);
    const uData = Cloud.getUserData(clean);
    await Cloud.saveUserData(uData, clean);
    renderHeader();
    renderProfile();
    await renderLeaderboard(false);
    showToast(`已切换侠客：${clean}`);
  });

  document.getElementById("refresh-lb-btn").addEventListener("click", () => renderLeaderboard(true));

  renderHeader();
  renderProfile();
  renderLeaderboard(false);
})();
</script>
</body>
</html>
