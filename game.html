<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0b0f19"/>
<title>柚刃 · 游戏玩法</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./cloud.js"></script>
<style>
:root{
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
  --safe-right:env(safe-area-inset-right,0px);
  --hud-pad:clamp(10px,2.6vw,18px);
  --card-pad:clamp(14px,4vw,22px);
  --radius:clamp(14px,3.6vw,22px);
  --score-fs:clamp(24px,7.5vw,34px);
  --title-fs:clamp(22px,6.2vw,28px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;
  height:100%;
  height:100svh;
  height:100dvh;
  overflow:hidden;
  background:#0b0f19;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:#f8fafc;
  overscroll-behavior:none;
}
body{user-select:none}
button,a,.btn-main,.btn-sub,.icon-btn,.m-card{
  touch-action:pan-y manipulation;
}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}

.hud{
  position:fixed;
  inset:0;
  pointer-events:none;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:calc(var(--hud-pad) + var(--safe-top)) calc(var(--hud-pad) + var(--safe-right)) calc(var(--hud-pad) + var(--safe-bottom)) calc(var(--hud-pad) + var(--safe-left));
  z-index:10;
}
.top-bar{display:flex;justify-content:space-between;align-items:flex-start;gap:clamp(8px,2vw,14px)}
.score-box{
  background:rgba(15,23,42,.68);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(251,191,36,.32);
  border-radius:var(--radius);
  padding:clamp(8px,2.4vw,12px) clamp(12px,3.6vw,18px);
  box-shadow:0 8px 30px rgba(0,0,0,.35);
  min-width:0;
  flex-shrink:1;
}
.score-label{font-size:clamp(9px,2.4vw,12px);letter-spacing:1.5px;color:#fbbf24;text-transform:uppercase;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-val{font-size:var(--score-fs);font-weight:800;line-height:1.1;background:linear-gradient(135deg,#fffbeb,#fcd34d,#fb923c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-variant-numeric:tabular-nums}
.best-val{font-size:clamp(9px,2.4vw,12px);color:#94a3b8;margin-top:2px;white-space:nowrap}
.right-hud{display:flex;align-items:center;gap:clamp(6px,1.6vw,10px);flex-shrink:0}
.status-pill{
  background:rgba(15,23,42,.68);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.15);
  border-radius:var(--radius);
  padding:clamp(8px,2.4vw,11px) clamp(10px,3vw,16px);
  display:flex;
  align-items:center;
  gap:5px;
  font-size:clamp(13px,3.6vw,17px);
  font-weight:700;
  box-shadow:0 8px 24px rgba(0,0,0,.3);
  white-space:nowrap;
}
.heart{transition:transform .25s,opacity .25s;filter:drop-shadow(0 0 6px rgba(244,63,94,.5))}
.heart.lost{opacity:.25;transform:scale(.75);filter:grayscale(1)}
.icon-btn{
  pointer-events:auto;
  width:clamp(36px,10vw,46px);
  height:clamp(36px,10vw,46px);
  border-radius:clamp(11px,3vw,15px);
  border:1px solid rgba(255,255,255,.18);
  background:rgba(15,23,42,.72);
  backdrop-filter:blur(12px);
  color:#f8fafc;
  font-size:clamp(15px,4.2vw,19px);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .15s,background .2s;
  flex-shrink:0;
}
.icon-btn:hover{background:rgba(30,41,59,.9)}
.icon-btn:active{transform:scale(.92)}

.overlay{
  position:fixed;
  inset:0;
  background:radial-gradient(circle at 50% 40%,rgba(15,23,42,.88),rgba(7,10,19,.97));
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  align-items:center;
  padding:calc(12px + var(--safe-top)) calc(12px + var(--safe-right)) calc(12px + var(--safe-bottom)) calc(12px + var(--safe-left));
  z-index:20;
  transition:opacity .3s;
  box-sizing:border-box;
  pointer-events:auto;
  overflow-y:auto;
  touch-action:pan-y;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
.overlay.hidden{opacity:0;pointer-events:none}

.card{
  width:100%;
  max-width:min(500px,calc(100vw - 24px));
  margin:auto;
  background:linear-gradient(160deg,rgba(30,41,59,.95),rgba(15,23,42,.99));
  border:1px solid rgba(251,191,36,.35);
  border-radius:clamp(20px,5.4vw,28px);
  padding:var(--card-pad);
  text-align:center;
  box-shadow:0 24px 60px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.15);
  max-height:calc(100dvh - 24px - var(--safe-top) - var(--safe-bottom));
  overflow-y:auto;
  touch-action:pan-y;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  position:relative;
  flex-shrink:0;
}
.top-nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
  gap:8px;
}
.back-link{
  display:inline-flex;
  align-items:center;
  gap:4px;
  color:#38bdf8;
  text-decoration:none;
  font-size:12px;
  font-weight:700;
  padding:5px 10px;
  border-radius:10px;
  background:rgba(56,189,248,.1);
  border:1px solid rgba(56,189,248,.25);
  white-space:nowrap;
}
.badge{display:inline-block;padding:4px 12px;border-radius:99px;font-size:clamp(9px,2.4vw,11px);letter-spacing:1.5px;color:#fcd34d;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.3);margin-bottom:6px}
.title{font-size:var(--title-fs);font-weight:900;letter-spacing:1.5px;background:linear-gradient(135deg,#fff,#fde68a 45%,#fb7185);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.subtitle{font-size:clamp(11px,2.8vw,12px);color:#94a3b8;line-height:1.45;margin-bottom:12px}

.meta-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
  padding:8px 12px;
  margin-bottom:12px;
  font-size:12px;
  color:#fde047;
  gap:8px;
}
.meta-bar span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.decor-link{color:#38bdf8;text-decoration:none;font-size:12px;font-weight:700;white-space:nowrap}

.mode-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.m-card{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);
  border-radius:16px;
  padding:12px 10px;
  text-align:left;
  cursor:pointer;
  transition:transform .15s,background .2s,border-color .2s;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.m-card:hover{background:rgba(255,255,255,.09);border-color:rgba(251,191,36,.45)}
.m-card:active{transform:scale(.97)}
.m-header{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.m-icon{font-size:18px}
.m-name{font-size:clamp(13px,3.4vw,15px);font-weight:800;color:#f8fafc}
.m-desc{font-size:clamp(10px,2.6vw,11px);color:#94a3b8;line-height:1.38}

.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0 14px}
.stat-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px}
.stat-num{font-size:clamp(16px,4.8vw,20px);font-weight:800;color:#fde047;margin-bottom:2px}
.stat-lbl{font-size:clamp(10px,2.8vw,12px);color:#94a3b8}
.rank-tag{font-size:clamp(11px,3.2vw,13px);font-weight:700;color:#fda4af;background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.28);border-radius:12px;padding:8px 10px;margin-bottom:12px}

.btn-group{display:flex;flex-direction:column;gap:8px}
.btn-main{width:100%;padding:clamp(11px,3.4vw,14px);border-radius:14px;border:none;font-size:clamp(14px,4.2vw,16px);font-weight:800;letter-spacing:1px;cursor:pointer;color:#0f172a;background:linear-gradient(135deg,#fde047,#fb923c);box-shadow:0 8px 22px rgba(251,146,60,.35);transition:transform .15s;min-height:48px}
.btn-main:active{transform:scale(.97)}
.btn-sub{display:flex;align-items:center;justify-content:center;width:100%;padding:clamp(10px,3.2vw,13px);border-radius:14px;border:1px solid rgba(56,189,248,.4);font-size:clamp(12px,3.6vw,14px);font-weight:700;text-decoration:none;cursor:pointer;color:#e0f2fe;background:linear-gradient(135deg,rgba(14,165,233,.2),rgba(45,212,191,.15));transition:transform .15s;min-height:44px}
.btn-sub:active{transform:scale(.97)}

.toast-msg{
  position:fixed;
  top:calc(18px + var(--safe-top));
  left:50%;
  transform:translateX(-50%) translateY(-16px);
  background:rgba(15,23,42,.95);
  border:1px solid rgba(251,191,36,.5);
  color:#fde047;
  padding:9px 18px;
  border-radius:99px;
  font-size:13px;
  font-weight:700;
  z-index:60;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s,transform .25s;
  box-shadow:0 10px 25px rgba(0,0,0,.5);
  white-space:nowrap;
}
.toast-msg.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="toast-msg" id="toast-msg"></div>

<div class="hud">
  <div class="top-bar">
    <div class="score-box">
      <div class="score-label" id="mode-tag">ARCADE · 街机模式</div>
      <div class="score-val" id="score-el">0</div>
      <div class="best-val" id="best-el">最高纪录 0</div>
    </div>
    <div class="right-hud">
      <div class="status-pill" id="status-pill">
        <span class="heart" id="h1">❤️</span><span class="heart" id="h2">❤️</span><span class="heart" id="h3">❤️</span>
      </div>
      <button class="icon-btn" id="snd-btn" title="音效开关">🔊</button>
      <button class="icon-btn" id="home-btn" title="暂停/选关">⏸</button>
    </div>
  </div>
</div>

<!-- 模式选择面板 -->
<div class="overlay" id="mode-modal">
  <div class="card">
    <div class="top-nav">
      <a class="back-link" href="./index.html">← 返回主页</a>
      <span style="font-size:11px;color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" id="active-decor-label">竹影清风 · 烈焰斩魔</span>
    </div>

    <span class="badge">POMELO GAMEPLAY</span>
    <h1 class="title">选择挑战模式</h1>
    <p class="subtitle">滑动屏幕斩切蜜柚，结算战绩将自动同步至云端排行榜。</p>

    <div class="meta-bar">
      <span id="player-name-tag">👤 侠客: 霜叶</span>
      <a class="decor-link" href="./decor.html">🎨 更换装扮</a>
    </div>

    <div class="mode-grid">
      <div class="m-card" data-mode="arcade">
        <div class="m-header">
          <span class="m-icon">🎯</span>
          <span class="m-name">经典街机</span>
        </div>
        <div class="m-desc">60秒限时，有炸弹与金柚王连击。</div>
      </div>
      <div class="m-card" data-mode="zen">
        <div class="m-header">
          <span class="m-icon">🍃</span>
          <span class="m-name">禅意解压</span>
        </div>
        <div class="m-desc">无时间无炸弹，无限连斩榨汁。</div>
      </div>
      <div class="m-card" data-mode="blitz">
        <div class="m-header">
          <span class="m-icon">⚡</span>
          <span class="m-name">30秒闪击</span>
        </div>
        <div class="m-desc">高密度密集掉落，极限手速爆发。</div>
      </div>
      <div class="m-card" data-mode="hardcore">
        <div class="m-header">
          <span class="m-icon">💀</span>
          <span class="m-name">命悬一线</span>
        </div>
        <div class="m-desc">3点生命，越切越快，绝不容失误。</div>
      </div>
    </div>
  </div>
</div>

<!-- 游戏结算战报面板 -->
<div class="overlay hidden" id="end-modal">
  <div class="card">
    <span class="badge" id="end-badge">SESSION REPORT</span>
    <h2 class="title" id="end-title">榨汁战斗结算</h2>
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-num" id="st-score">0</div><div class="stat-lbl">最终得分</div></div>
      <div class="stat-box"><div class="stat-num" id="st-juice">0 ml</div><div class="stat-lbl">累计鲜榨果汁</div></div>
      <div class="stat-box"><div class="stat-num" id="st-combo">0 连斩</div><div class="stat-lbl">最高单刀爆发</div></div>
      <div class="stat-box"><div class="stat-num" id="st-count">0 个</div><div class="stat-lbl">切开柚子总数</div></div>
    </div>
    <div class="rank-tag" id="st-rank">评级：清风切柚客 · 表现优异</div>
    <div class="btn-group">
      <button class="btn-main" id="retry-btn">再来一局</button>
      <button class="btn-sub" id="choose-mode-btn">切换挑战模式</button>
      <a class="btn-sub" href="./index.html">返回主菜单</a>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

const Cloud = window.PomeloCloud;
Cloud.initSupabase();

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById("toast-msg");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2000);
}

let decorConfig = Cloud.getDecorConfig();
let currentUser = Cloud.getCurrentUser();

function syncMetaUI() {
  decorConfig = Cloud.getDecorConfig();
  currentUser = Cloud.getCurrentUser();
  document.getElementById("active-decor-label").textContent = `${decorConfig.bgLabel} · ${decorConfig.bladeLabel}`;
  document.getElementById("player-name-tag").textContent = `👤 侠客: ${currentUser}`;
}
syncMetaUI();

async function commitSessionAndAchievements() {
  const uData = Cloud.getUserData(currentUser);
  uData.totalScore += state.score;
  uData.totalJuice += state.juiceMl;
  uData.totalSliced += state.slicedCount;
  if (state.maxCombo > uData.maxCombo) uData.maxCombo = state.maxCombo;
  if (state.score > uData.bestArcade) uData.bestArcade = state.score;

  await Cloud.saveUserData(uData, currentUser);
  const newlyUnlocked = Cloud.evaluateNewAchievements(currentUser);
  newlyUnlocked.forEach(ach => {
    addFloatText(W * 0.5, H * 0.25, `🏆 解锁成就: ${ach.name}!`, "#fde047", 24);
    playSlice(8, true);
  });
}

// ================= 画布与粒子系统 =================
const cvs = document.getElementById("c");
const ctx = cvs.getContext("2d");
let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  if (!W || !H) {
    W = document.documentElement.clientWidth || 320;
    H = document.documentElement.clientHeight || 568;
  }
  cvs.width = Math.floor(W * DPR);
  cvs.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 120));
resize();
document.addEventListener("gesturestart", e => e.preventDefault());

const BLADE_CONFIGS = {
  flame:     { outer: "rgba(251,146,60,0.7)", core: "#fff5f5", spark: "#f97316" },
  frost:     { outer: "rgba(56,189,248,0.7)", core: "#e0f2fe", spark: "#38bdf8" },
  lightning: { outer: "rgba(250,204,21,0.75)",core: "#fef08a", spark: "#eab308" },
  sakura:    { outer: "rgba(244,114,182,0.7)",core: "#fdf2f8", spark: "#ec4899" }
};

let decorParticles = [];
function initDecorParticles() {
  decorParticles = [];
  const count = decorConfig.bgSkin === "cyber" ? 45 : 22;
  for (let i = 0; i < count; i++) {
    decorParticles.push({
      x: Math.random() * W, y: Math.random() * H,
      vx: decorConfig.bgSkin === "cyber" ? (Math.random() - 0.5) * 1.5 : (-0.4 - Math.random() * 0.6),
      vy: decorConfig.bgSkin === "cyber" ? (1 + Math.random() * 2.5) : (0.5 + Math.random() * 0.8),
      size: decorConfig.bgSkin === "sakura" ? (4 + Math.random() * 5) : (2 + Math.random() * 4),
      rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 0.03,
      alpha: 0.15 + Math.random() * 0.45
    });
  }
}
initDecorParticles();

// ================= 音效 =================
let actx = null, soundOn = true, lastSwingTime = 0;
function initAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx && actx.state === "suspended") actx.resume();
  } catch (e) {}
}
document.getElementById("snd-btn").onclick = () => {
  soundOn = !soundOn;
  document.getElementById("snd-btn").textContent = soundOn ? "🔊" : "🔇";
};

function playSwing(speed) {
  if (!soundOn) return;
  const now = performance.now();
  if (now - lastSwingTime < 100) return;
  lastSwingTime = now;
  try {
    initAudio();
    const dur = 0.12, buf = actx.createBuffer(1, actx.sampleRate * dur, actx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.sin((i / data.length) * Math.PI);
    const src = actx.createBufferSource(), flt = actx.createBiquadFilter(), g = actx.createGain();
    src.buffer = buf; flt.type = "bandpass"; flt.Q.value = 2.5;
    const baseF = Math.min(2000, 600 + speed * 25);
    flt.frequency.setValueAtTime(baseF * 0.5, actx.currentTime);
    flt.frequency.exponentialRampToValueAtTime(baseF * 1.4, actx.currentTime + dur);
    g.gain.setValueAtTime(0.12, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    src.connect(flt); flt.connect(g); g.connect(actx.destination); src.start();
  } catch (e) {}
}

function playSlice(combo = 1, isSpecial = false) {
  if (!soundOn) return;
  try {
    initAudio();
    const t = actx.currentTime;
    const dur = 0.15, buf = actx.createBuffer(1, actx.sampleRate * dur, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (actx.sampleRate * 0.04));
    const src = actx.createBufferSource(), flt = actx.createBiquadFilter(), ng = actx.createGain();
    src.buffer = buf; flt.type = "highpass"; flt.frequency.value = 1300;
    ng.gain.setValueAtTime(0.25, t); ng.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(flt); flt.connect(ng); ng.connect(actx.destination); src.start();

    const scale = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5];
    const freq = scale[Math.min(combo - 1, scale.length - 1)] * (isSpecial ? 1.25 : 1);
    const osc = actx.createOscillator(), og = actx.createGain();
    osc.type = isSpecial ? "triangle" : "sine";
    osc.frequency.setValueAtTime(freq, t); osc.frequency.exponentialRampToValueAtTime(freq * 1.18, t + 0.16);
    og.gain.setValueAtTime(0.2, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    osc.connect(og); og.connect(actx.destination); osc.start(); osc.stop(t + 0.18);
  } catch (e) {}
}

function playBomb() {
  if (!soundOn) return;
  try {
    initAudio();
    const t = actx.currentTime, osc = actx.createOscillator(), g = actx.createGain();
    osc.type = "sawtooth"; osc.frequency.setValueAtTime(120, t); osc.frequency.exponentialRampToValueAtTime(30, t + 0.4);
    g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
    osc.connect(g); g.connect(actx.destination); osc.start(); osc.stop(t + 0.42);
  } catch (e) {}
}

const TYPES = {
  red:   { name: "红心蜜柚", rind: "#f59e0b", pith: "#fef3c7", flesh: "#fb7185", juice: "#f43f5e", r: 42, pts: 10, ml: 65 },
  honey: { name: "黄金蜜柚", rind: "#eab308", pith: "#fefce8", flesh: "#fde047", juice: "#facc15", r: 44, pts: 10, ml: 70 },
  green: { name: "翡翠青柚", rind: "#65a30d", pith: "#ecfccb", flesh: "#bef264", juice: "#84cc16", r: 40, pts: 15, ml: 55 },
  ice:   { name: "冰镇薄荷柚", rind: "#0284c7", pith: "#e0f2fe", flesh: "#7dd3fc", juice: "#38bdf8", r: 41, pts: 20, ml: 60 },
  king:  { name: "巨型金柚王", rind: "#d97706", pith: "#fffbeb", flesh: "#fb923c", juice: "#fbbf24", r: 62, pts: 15, ml: 160 },

let state = {

function openModeModal() {

async function endGame() {

function spawnWave() {
  state.waveCount++;
  const diff = Math.min(1, state.score / 800);
  const isFever = state.feverTimer > 0;
  const isBlitz = state.mode === "blitz";
  const count = isFever
    ? 5 + Math.floor(Math.random() * 3)
    : (isBlitz ? 3 + Math.floor(Math.random() * 4) : (state.mode === "zen" ? 3 : 1 + Math.floor(Math.random() * (2 + diff * 2))));

  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      if (!state.running) return;
      let kind = "red";
      const r = Math.random();
      if ((state.mode === "arcade" || state.mode === "hardcore") && !isFever && r < 0.15 + (state.mode === "hardcore" ? 0.08 : 0) && state.waveCount > 1) {
        kind = "bomb";
      } else if (r < 0.22) { kind = "king"; }
      else if (r < 0.32) { kind = "ice"; }
      else if (r < 0.58) { kind = "green"; }
      else if (r < 0.8)  { kind = "honey"; }

      const cfg = TYPES[kind];
      const margin = Math.max(60, W * 0.12);
      const x = margin + Math.random() * (W - margin * 2);
      const peakY = H * (0.15 + Math.random() * 0.25);
      const g = 980;
      const vy = -Math.sqrt(2 * g * (H + 50 - peakY)) * (state.mode === "hardcore" ? 1.12 : 1);
      const targetX = W * 0.5 + (Math.random() - 0.5) * W * 0.6;
      const flightT = -vy / g;
      const vx = (targetX - x) / (flightT * (0.9 + Math.random() * 0.3));

      fruits.push({
        kind, cfg, x, y: H + cfg.r + 10, vx, vy, g,
        rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 4,
        hp: kind === "king" ? 4 : 1, maxHp: kind === "king" ? 4 : 1,
        hitCd: 0, scale: 1
      });
    }, i * 100);
  }
}

let pointerDown = false;
function addPoint(x, y) {
  const now = performance.now();
  if (trail.length > 0) {
    const prev = trail[trail.length - 1];
    const dist = Math.hypot(x - prev.x, y - prev.y);
    if (dist > 5) {
      playSwing(dist);
      checkSliceSegment(prev.x, prev.y, x, y);
      if (Math.random() < 0.4) {
        const cfg = BLADE_CONFIGS[decorConfig.bladeSkin] || BLADE_CONFIGS.flame;
        particles.push({
          x, y, vx: (Math.random() - 0.5) * 120, vy: (Math.random() - 0.5) * 120,
          r: 2 + Math.random() * 3, color: cfg.spark, life: 0.25, maxLife: 0.25
        });
      }
    }
  }
  trail.push({ x, y, t: now });
  if (trail.length > 22) trail.shift();
}

function getPointerPos(e) {
  if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}

cvs.addEventListener("pointerdown", e => {
  if (!state.running) return;
  pointerDown = true; trail = [];
  const p = getPointerPos(e);
  addPoint(p.x, p.y);
  try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
}, { passive: false });

window.addEventListener("pointermove", e => {
  if (!state.running || !pointerDown) return;
  const p = getPointerPos(e);
  addPoint(p.x, p.y);
}, { passive: false });

window.addEventListener("pointerup", () => { pointerDown = false; });
window.addEventListener("pointercancel", () => { pointerDown = false; });

function segCircleIntersect(x1, y1, x2, y2, cx, cy, r) {
  const dx = x2 - x1, dy = y2 - y1, len2 = dx * dx + dy * dy;
  if (len2 === 0) return Math.hypot(cx - x1, cy - y1) <= r;
  let t = ((cx - x1) * dx + (cy - y1) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(cx - (x1 + t * dx), cy - (y1 + t * dy)) <= r;
}

function checkSliceSegment(x1, y1, x2, y2) {
  const angle = Math.atan2(y2 - y1, x2 - x1);
  for (let i = fruits.length - 1; i >= 0; i--) {
    const f = fruits[i];
    if (f.hitCd > 0) continue;
    if (segCircleIntersect(x1, y1, x2, y2, f.x, f.y, f.cfg.r * 1.1)) {
      handleSlice(f, i, angle);
    }
  }
}

function handleSlice(f, idx, angle) {
  if (f.kind === "bomb") {
    fruits.splice(idx, 1);
    playBomb();
    state.shake = 22; state.flash = 0.7; state.flashColor = "#ef4444";
    if (state.mode === "hardcore") state.lives = 0;
    else state.lives--;
    updateHUD();
    spawnBurst(f.x, f.y, "#ef4444", "#1e293b", 28);
    addFloatText(f.x, f.y, "💥 炸弹引爆！", "#fda4af", 24);
    if (state.lives <= 0) setTimeout(endGame, 380);
    return;
  }

  if (f.kind === "king" && f.hp > 1) {
    f.hp--; f.hitCd = 0.1; f.scale = 1.18; f.vy = Math.min(f.vy, -220);
    playSlice(5 - f.hp, true);
    state.shake = 6;
    spawnBurst(f.x, f.y, f.cfg.juice, f.cfg.flesh, 14);
    addFloatText(f.x, f.y - 20, `狂斩 x${5 - f.hp}! +15`, "#fde047", 22);
    state.score += 15; state.juiceMl += 45; updateHUD();
    return;
  }

  fruits.splice(idx, 1);
  state.slicedCount++;
  state.juiceMl += f.cfg.ml;
  state.swipeCombo++;
  state.swipeComboTimer = 0.28;
  state.lastSwipePos = { x: f.x, y: f.y };
  if (state.swipeCombo > state.maxCombo) state.maxCombo = state.swipeCombo;

  const isKing = f.kind === "king", isIce = f.kind === "ice";
  playSlice(state.swipeCombo, isKing || isIce);
  state.hitstop = isKing ? 0.05 : 0.025;
  state.shake = isKing ? 14 : 6;

  if (isIce) {
    state.freezeTimer = 3;
    state.flash = 0.3; state.flashColor = "#38bdf8";
    addFloatText(f.x, f.y - 35, "❄️ 冰霜慢放 3s", "#7dd3fc", 22);
  } else if (isKing) {
    state.feverTimer = 4;
    state.flash = 0.35; state.flashColor = "#facc15";
    addFloatText(f.x, f.y - 40, "👑 金柚王爆裂 · 狂热时刻!", "#fde047", 24);
  }

  const pts = f.cfg.pts * (state.feverTimer > 0 ? 2 : 1) * (state.mode === "blitz" ? 1.5 : 1);
  state.score += Math.round(pts); updateHUD();
  addFloatText(f.x, f.y, `+${Math.round(pts)}`, f.cfg.flesh, isKing ? 26 : 20);

  const perp = angle + Math.PI / 2;
  [-1, 1].forEach(side => {
    halves.push({
      cfg: f.cfg, x: f.x + Math.cos(perp) * side * 8, y: f.y + Math.sin(perp) * side * 8,
      vx: f.vx * 0.6 + Math.cos(perp) * side * 140, vy: f.vy * 0.7 - 75,
      rot: angle, vr: side * (3 + Math.random() * 3), side, alpha: 1
    });
  });

  spawnBurst(f.x, f.y, f.cfg.juice, f.cfg.flesh, isKing ? 35 : 18);
  stains.push({ x: f.x, y: f.y, r: f.cfg.r * (isKing ? 1.4 : 1.05), color: f.cfg.juice, alpha: 0.25 });
  if (stains.length > 24) stains.shift();
}

function spawnBurst(x, y, c1, c2, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2, sp = 90 + Math.random() * 340;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      r: 3 + Math.random() * 5, color: i % 2 === 0 ? c1 : c2,
      life: 0.5 + Math.random() * 0.3, maxLife: 0.8
    });
  }
}

function addFloatText(x, y, text, color, size = 20) {
  floatTexts.push({ x, y, text, color, size, life: 0.8, vy: -60 });
}

function drawBackground() {
  const bgGrad = ctx.createRadialGradient(W * 0.5, H * 0.35, 30, W * 0.5, H * 0.5, Math.max(W, H) * 0.85);
  if (decorConfig.bgSkin === "bamboo") {
    bgGrad.addColorStop(0, "#13201d"); bgGrad.addColorStop(1, "#070c0b");
    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "rgba(20,45,35,0.45)";
    ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(0, H * 0.65);
    ctx.quadraticCurveTo(W * 0.3, H * 0.5, W * 0.6, H * 0.6);
    ctx.quadraticCurveTo(W * 0.85, H * 0.7, W, H * 0.62);
    ctx.lineTo(W, H); ctx.fill();
  } else if (decorConfig.bgSkin === "sunset") {
    bgGrad.addColorStop(0, "#3b1c1c"); bgGrad.addColorStop(0.5, "#1e1124"); bgGrad.addColorStop(1, "#0a0712");
    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
    const sun = ctx.createRadialGradient(W * 0.5, H * 0.3, 10, W * 0.5, H * 0.3, W * 0.4);
    sun.addColorStop(0, "rgba(251,146,60,0.35)"); sun.addColorStop(1, "rgba(251,146,60,0)");
    ctx.fillStyle = sun; ctx.fillRect(0, 0, W, H);
  } else if (decorConfig.bgSkin === "cyber") {
    bgGrad.addColorStop(0, "#2e1065"); bgGrad.addColorStop(0.5, "#1e1b4b"); bgGrad.addColorStop(1, "#030712");
    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(236,72,153,0.12)"; ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 60) {
      ctx.beginPath(); ctx.moveTo(x, H * 0.5); ctx.lineTo((x - W * 0.5) * 2.2 + W * 0.5, H); ctx.stroke();
    }
  } else {
    bgGrad.addColorStop(0, "#2d1b2d"); bgGrad.addColorStop(0.5, "#1d1524"); bgGrad.addColorStop(1, "#09070d");
    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
  }

  decorParticles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    if (p.x < -20) p.x = W + 20; if (p.x > W + 20) p.x = -20;
    if (p.y > H + 20) { p.y = -20; p.x = Math.random() * W; }
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.globalAlpha = p.alpha;
    if (decorConfig.bgSkin === "sakura") {
      ctx.fillStyle = "#f472b6";
      ctx.beginPath(); ctx.ellipse(0, 0, p.size, p.size * 0.6, 0, 0, Math.PI * 2); ctx.fill();
    } else if (decorConfig.bgSkin === "cyber") {
      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(0, 0, p.size * 1.5, p.size * 1.5);
    } else {
      ctx.fillStyle = decorConfig.bgSkin === "sunset" ? "#f59e0b" : "#84cc16";
      ctx.beginPath(); ctx.ellipse(0, 0, p.size * 2, p.size, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  });
  ctx.globalAlpha = 1;
}

function drawPomelo(f) {
  ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot); ctx.scale(f.scale, f.scale);
  const r = f.cfg.r;
  if (f.kind === "bomb") {
    const pulse = 1 + Math.sin(performance.now() * 0.015) * 0.12;
    const grd = ctx.createRadialGradient(0, 0, r * 0.4, 0, 0, r * 1.4 * pulse);
    grd.addColorStop(0, "rgba(239,68,68,0.4)"); grd.addColorStop(1, "rgba(239,68,68,0)");
    ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(0, 0, r * 1.4 * pulse, 0, Math.PI * 2); ctx.fill();

    const body = ctx.createRadialGradient(-r * 0.3, -r * 0.3, 4, 0, 0, r);
    body.addColorStop(0, "#475569"); body.addColorStop(0.5, "#1e293b"); body.addColorStop(1, "#090d16");
    ctx.fillStyle = body; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 2.5; ctx.stroke();

    ctx.strokeStyle = "#f87171"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-9, -9); ctx.lineTo(9, 9); ctx.moveTo(9, -9); ctx.lineTo(-9, 9); ctx.stroke();
    ctx.restore();
    return;
  }

  if (f.kind === "king" || f.kind === "ice") {
    const glow = ctx.createRadialGradient(0, 0, r * 0.7, 0, 0, r * 1.3);
    glow.addColorStop(0, f.kind === "king" ? "rgba(250,204,21,0.4)" : "rgba(56,189,248,0.4)");
    glow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0, 0, r * 1.3, 0, Math.PI * 2); ctx.fill();
  }

  const grad = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r * 1.02);
  grad.addColorStop(0, "#fef9c3"); grad.addColorStop(0.28, f.cfg.rind); grad.addColorStop(1, "#78350f");
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(0, -r * 1.04);
  ctx.bezierCurveTo(r * 0.65, -r * 0.95, r * 1.05, -r * 0.25, r * 0.98, r * 0.32);
  ctx.bezierCurveTo(r * 0.9, r * 0.88, r * 0.45, r * 1.02, 0, r * 1.02);
  ctx.bezierCurveTo(-r * 0.45, r * 1.02, -r * 0.9, r * 0.88, -r * 0.98, r * 0.32);
  ctx.bezierCurveTo(-r * 1.05, -r * 0.25, -r * 0.65, -r * 0.95, 0, -r * 1.04);
  ctx.fill();

  if (f.kind === "king") {
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.55, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * f.hp) / f.maxHp); ctx.stroke();
  }
  ctx.restore();
}

function drawHalf(h) {
  ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(h.rot); ctx.globalAlpha = Math.max(0, h.alpha);
  const r = h.cfg.r, startA = h.side === -1 ? Math.PI : 0, endA = h.side === -1 ? Math.PI * 2 : Math.PI;
  ctx.fillStyle = h.cfg.rind; ctx.beginPath(); ctx.arc(0, 0, r, startA, endA); ctx.closePath(); ctx.fill();
  ctx.fillStyle = h.cfg.pith; ctx.beginPath(); ctx.arc(0, 0, r * 0.86, startA, endA); ctx.closePath(); ctx.fill();
  ctx.fillStyle = h.cfg.flesh; ctx.beginPath(); ctx.arc(0, 0, r * 0.76, startA, endA); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = h.cfg.pith; ctx.lineWidth = 2;
  for (let i = 1; i < 5; i++) {
    const a = startA + ((endA - startA) * i) / 5;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * r * 0.78, Math.sin(a) * r * 0.78); ctx.stroke();
  }
  ctx.restore();
}

let lastTime = performance.now();
function loop(now) {
  const rawDt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  if (state.hitstop > 0) {
    state.hitstop -= rawDt;
    requestAnimationFrame(loop);
    return;
  }

  const timeScale = state.freezeTimer > 0 ? 0.42 : 1;
  const dt = rawDt * timeScale;

  if (state.running) {
    if (state.freezeTimer > 0) state.freezeTimer -= rawDt;
    if (state.feverTimer > 0) state.feverTimer -= rawDt;

    if (state.mode === "arcade" || state.mode === "blitz") {
      state.timeLeft -= rawDt;
      updateHUD();
      if (state.timeLeft <= 0) endGame();
    }

    if (state.swipeComboTimer > 0) {
      state.swipeComboTimer -= rawDt;
      if (state.swipeComboTimer <= 0 && state.swipeCombo >= 3) {
        const bonus = state.swipeCombo * 15;
        state.score += bonus; updateHUD();
        addFloatText(state.lastSwipePos.x, state.lastSwipePos.y - 30, `⚡ ${state.swipeCombo}连斩暴击! +${bonus}`, "#fde047", 26);
      }
      if (state.swipeComboTimer <= 0) state.swipeCombo = 0;
    }

    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0) {
      spawnWave();
      const blitzMult = state.mode === "blitz" ? 0.65 : 1;
      const hardcoreMult = state.mode === "hardcore" ? Math.max(0.45, 1.1 - state.score / 600) : 1;
      state.spawnTimer = (state.feverTimer > 0 ? 0.7 : Math.max(0.8, 1.8 - state.score / 1000)) * blitzMult * hardcoreMult;
    }
  }

  ctx.save();
  if (state.shake > 0) {
    ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
    state.shake *= 0.82;
    if (state.shake < 0.3) state.shake = 0;
  }

  drawBackground();

  stains.forEach(s => {
    s.alpha *= 0.995;
    ctx.fillStyle = s.color; ctx.globalAlpha = s.alpha;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  for (let i = fruits.length - 1; i >= 0; i--) {
    const f = fruits[i];
    f.x += f.vx * dt; f.y += f.vy * dt; f.vy += f.g * dt; f.rot += f.vr * dt;
    if (f.hitCd > 0) f.hitCd -= rawDt;
    if (f.scale > 1) f.scale = Math.max(1, f.scale - rawDt * 1.5);
    drawPomelo(f);

    if (f.y > H + f.cfg.r + 50 && f.vy > 0) {
      fruits.splice(i, 1);
      if (state.running && (state.mode === "arcade" || state.mode === "hardcore") && f.kind !== "bomb" && f.kind !== "king") {
        state.lives--; updateHUD();
        addFloatText(Math.min(W - 60, Math.max(60, f.x)), H - 45, "漏掉柚子 -1❤️", "#fb7185", 18);
        if (state.lives <= 0) endGame();
      }
    }
  }

  for (let i = halves.length - 1; i >= 0; i--) {
    const h = halves[i];
    h.x += h.vx * dt; h.y += h.vy * dt; h.vy += 980 * dt; h.rot += h.vr * dt;
    if (h.y > H + 80) halves.splice(i, 1);
    else drawHalf(h);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 750 * dt; p.life -= rawDt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  const cutoff = now - 150;
  trail = trail.filter(pt => pt.t >= cutoff);
  if (trail.length >= 2) {
    const bladeCfg = BLADE_CONFIGS[decorConfig.bladeSkin] || BLADE_CONFIGS.flame;
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    for (let i = 1; i < trail.length; i++) {
      const p0 = trail[i - 1], p1 = trail[i], ratio = i / trail.length;
      ctx.strokeStyle = bladeCfg.outer;
      ctx.lineWidth = ratio * 18;
      ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();

      ctx.strokeStyle = bladeCfg.core;
      ctx.lineWidth = ratio * 6;
      ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
    }
  }

  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const ft = floatTexts[i];
    ft.y += ft.vy * rawDt; ft.life -= rawDt;
    if (ft.life <= 0) { floatTexts.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = Math.min(1, ft.life * 1.5);
    ctx.font = `900 ${ft.size}px "PingFang SC",sans-serif`;
    ctx.textAlign = "center";
    ctx.fillStyle = "#090d16"; ctx.fillText(ft.text, ft.x + 2, ft.y + 2);
    ctx.fillStyle = ft.color; ctx.fillText(ft.text, ft.x, ft.y);
    ctx.restore();
  }

  if (state.flash > 0) {
    ctx.fillStyle = state.flashColor; ctx.globalAlpha = state.flash;
    ctx.fillRect(0, 0, W, H);
    state.flash = Math.max(0, state.flash - rawDt * 1.6);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
  requestAnimationFrame(loop);
}

updateHUD();
requestAnimationFrame(loop);

const urlMode = new URLSearchParams(window.location.search).get("mode");
if (urlMode && ["arcade", "zen", "blitz", "hardcore"].includes(urlMode)) {
  startGame(urlMode);
}
})();
</script>
